<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>misha fedotov</title>
    <link href="https://fonts.cdnfonts.com/css/utah-condensed" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #ffffff;
            font-family: 'Utah Condensed', Arial, sans-serif;
            color: #000;
        }
        .menu {
            position: fixed;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu a {
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            color: #000;
            width: fit-content;
            line-height: 0.95;
            border-bottom: 1px solid transparent;
        }
        .menu a:hover { border-bottom: 1px solid #000; }
        .menu .contacts {
            font-size: 18px;
            text-transform: capitalize;
            letter-spacing: 0.8px;
            line-height: 1.1;
        }

        /* ================= MOBILE VERSION ================= */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        .menu-toggle span {
            display: block;
            width: 30px;
            height: 3px;
            background-color: #000;
            margin: 6px 0;
            transition: 0.3s;
        }
        .menu-toggle.active span:nth-child(1) { transform: rotate(-45deg) translate(-6px, 6px); }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: rotate(45deg) translate(-6px, -6px); }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .menu {
                position: fixed;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100vh;
                background-color: #ffffff;
                transform: none;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 12px;
                transition: left 0.3s ease;
                z-index: 99;
            }
            .menu.active { left: 0; }
            .menu a { font-size: 78px; text-align: center; } /* 52px * 1.5 */
            .menu .contacts { font-size: 27px; } /* 18px * 1.5 */
        }
    </style>
</head>
<body>

    <button class="menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="menu active">
        <a href="index.html">misha fedotov</a>
        <a href="art.html">art</a>
        <a href="ad.html">ad</a>
        <a href="gamedev.html">gamedev</a>
        <a href="https://t.me/mishafedotov" target="_blank" class="contacts">Telegram</a>
        <a href="https://soundcloud.com/misha_fedotov/" target="_blank" class="contacts">Soundcloud</a>
        <a href="https://behance.net/gallery/151338065/Portfolio" target="_blank" class="contacts">Behance</a>
        <a href="https://instagram.com/mishshaa" target="_blank" class="contacts">Instagram</a>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.querySelector('.menu-toggle');
            const menu = document.querySelector('.menu');
            if (menuToggle && menu) {
                menuToggle.addEventListener('click', () => {
                    menu.classList.toggle('active');
                    menuToggle.classList.toggle('active');
                });
                menu.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        menu.classList.remove('active');
                        menuToggle.classList.remove('active');
                    });
                });
            }
        });
    </script>
</body>
</html>
