<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ad — misha fedotov</title>
    <link href="https://fonts.cdnfonts.com/css/utah-condensed" rel="stylesheet">
    <style>
        :root { --image-left: 550px; }
        * { box-sizing: border-box; }
        body { margin: 0; background-color: #ffffff; font-family: 'Utah Condensed', Arial, sans-serif; color: #000; }

        .menu { position: fixed; top: 50%; left: 40px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 20; }
        .menu a { font-size: 52px; font-weight: 700; display: flex; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; color: #000; width: fit-content; line-height: 0.95; border-bottom: 1px solid transparent; }
        .menu a:hover { border-bottom: 1px solid #000; }
        .menu .contacts { font-size: 18px; text-transform: capitalize; letter-spacing: 0.8px; line-height: 1.1; }

        .section { position: relative; height: auto; min-height: 100vh; overflow: visible; }
        .section::before { content: ""; position: fixed; top: 0; bottom: 0; left: var(--image-left); right: 0; background-image: url('art/AD-font.jpg'); background-size: cover; background-position: center; z-index: 0; }

        .content { position: relative; z-index: 1; width: calc(100% - var(--image-left) - 120px); margin-left: calc(var(--image-left) + 60px); margin-right: 60px; padding-top: 120px; color: #fff; }
        h2 { font-size: 52px; font-weight: 700; text-transform: uppercase; margin: 0 0 24px 0; text-align: center; }
        .video-container { margin: 80px 0; }
        .video-container iframe { width: 100%; height: 400px; border: none; loading: lazy; }

        /* ================= MOBILE VERSION ================= */
        .menu-toggle { display: none; position: fixed; top: 20px; left: 20px; z-index: 100; background: transparent; border: none; cursor: pointer; padding: 10px; }
        .menu-toggle span { display: block; width: 30px; height: 3px; background-color: #000; margin: 6px 0; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .menu {
                position: fixed;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100vh;
                background-color: #ffffff;
                transform: none;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
                padding-left: 40px;
                gap: 8px;
                z-index: 99;
            }
            .menu.active { left: 0; }
            
            /* ========================================== */
            /* 🔧 НАСТРОЙКА РАЗМЕРА ШРИФТА (МОБИЛЬНАЯ ВЕРСИЯ) */
            /* ========================================== */
            .menu a { 
                font-size: 38px; /* <-- МЕНЯТЬ РАЗМЕР ЗДЕСЬ */
                text-align: left; 
            }
            .menu .contacts { 
                font-size: 14px; /* <-- МЕНЯТЬ РАЗМЕР ЗДЕСЬ */
            }

            :root { --image-left: 0px; }
            .section::before { left: 0; right: 0; background-color: rgba(0, 0, 0, 0.4); background-blend-mode: multiply; }
            .content { width: calc(100% - 40px); margin-left: 20px; margin-right: 20px; padding-top: 80px; }
            h2 { font-size: 36px; }
            .video-container { margin: 40px 0; }
            .video-container iframe { height: 250px !important; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
    </button>

    <nav class="menu">
        <a href="index.html">misha fedotov</a>
        <a href="art.html">art</a>
        <a href="ad.html">ad</a>
        <a href="gamedev.html">gamedev</a>
        <a href="https://t.me/mishafedotov" target="_blank" class="contacts">Telegram</a>
        <a href="https://soundcloud.com/misha_fedotov/" target="_blank" class="contacts">Soundcloud</a>
        <a href="https://behance.net/gallery/151338065/Portfolio" target="_blank" class="contacts">Behance</a>
        <a href="https://instagram.com/mishshaa" target="_blank" class="contacts">Instagram</a>
    </nav>

    <section class="section">
        <div class="content">
            <h2>Music & sound design for AD videos</h2>
            <div class="video-container">
                <iframe loading="lazy" width="560" height="315" src="https://www.youtube.com/embed/JUmmdt1l3JM" frameborder="0" allow="autoplay; picture-in-picture" allowfullscreen sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
            </div>
            <div class="video-container">
                <iframe loading="lazy" width="560" height="315" src="https://www.youtube.com/embed/-HWip3gdENY" frameborder="0" allow="autoplay; picture-in-picture" allowfullscreen sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
            </div>
            <div class="video-container">
                <iframe loading="lazy" width="560" height="315" src="https://www.youtube.com/embed/M8bIbQUraoU" frameborder="0" allow="autoplay; picture-in-picture" allowfullscreen sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.querySelector('.menu-toggle');
            const menu = document.querySelector('.menu');
            if (menuToggle && menu) {
                menuToggle.addEventListener('click', () => {
                    menu.classList.toggle('active');
                });
                menu.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        menu.classList.remove('active');
                    });
                });
            }
        });
    </script>
</body>
</html>
